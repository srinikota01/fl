<div class="page theme--home">
  <app-site-header [subscript]="''" [navItems]="navItems" />

  <main class="content">
    <section class="hero" id="about">
      <span class="hero__orb hero__orb--one" aria-hidden="true"></span>
      <span class="hero__orb hero__orb--two" aria-hidden="true"></span>
      <div class="wrap">
        <h1>On a mission to <strong>Transform Nextgen INDIA</strong></h1>
      </div>
    </section>

    <section class="section" aria-label="Skilltej portals">
      <div class="wrap">
        <div class="portal-grid">
          <a class="tile portal portal--academy accent--blue" href="https://academy.skilltej.com">
            <span class="tile__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4 2.5 8.5 12 13l9.5-4.5L12 4Z" />
                <path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" />
                <path d="M21.5 8.5v5" />
              </svg>
            </span>
            <h2>Academy</h2>
            <span class="cue" aria-hidden="true">&rarr;</span>
          </a>

          <a class="tile portal portal--stemlabs accent--teal" href="https://stemlabs.skilltej.com">
            <span class="tile__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 3h6" />
                <path d="M10 3v6.2L4.8 18a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9.2V3" />
                <path d="M7.5 15h9" />
                <circle cx="10.5" cy="17.5" r="0.6" fill="currentColor" stroke="none" />
                <circle cx="14" cy="18.6" r="0.6" fill="currentColor" stroke="none" />
              </svg>
            </span>
            <h2>S.T.E.M.</h2>
            <span class="cue" aria-hidden="true">&rarr;</span>
          </a>

          <a class="tile portal portal--preschool accent--orange" href="https://preschool-labs.skilltej.com">
            <span class="tile__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="13" width="8" height="8" rx="1.5" />
                <rect x="13" y="13" width="8" height="8" rx="1.5" />
                <path d="M7 13V9.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2V13" />
                <path d="m12 3 1.4 3.1L16.5 7.5l-3.1 1.4L12 12l-1.4-3.1L7.5 7.5l3.1-1.4L12 3Z" />
              </svg>
            </span>
            <h2>Preschool Labs</h2>
            <span class="cue" aria-hidden="true">&rarr;</span>
          </a>

          <a class="tile portal portal--certify accent--violet" href="https://certify.skilltej.com">
            <span class="tile__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="9" r="6" />
                <path d="m8.5 14-1.2 7L12 18.4l4.7 2.6-1.2-7" />
                <path d="m9.5 9 1.8 1.8 3.4-3.6" />
              </svg>
            </span>
            <h2>Certify</h2>
            <span class="cue" aria-hidden="true">&rarr;</span>
          </a>
        </div>
      </div>
    </section>

    <app-contact description="Questions about a program, a lab or a partnership? We would love to hear from you." />
  </main>
</div>
